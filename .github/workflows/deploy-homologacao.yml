name: Publicar homologacao no Firebase Hosting

on:
  push:
    branches: [homologacao]

permissions:
  contents: read

concurrency:
  group: firebase-hosting-homologacao
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar frontend de homologacao
    if: github.repository == 'sergiocamargo-sistema/crm' && github.ref == 'refs/heads/homologacao'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: homologacao
      url: https://sergio-6ceff-homologacao.web.app
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obter a branch de homologacao
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar Node e cache npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias do lockfile
        run: npm ci
      - name: Preparar Firebase CLI
        run: npm install --global firebase-tools@15.31.0
      - name: Registrar identificacao publica do deploy
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const request = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          request.searchParams.set('audience', 'projects/364283541545/locations/global/workloadIdentityPools/crm-homologacao-20261127/providers/github');
          const response = await fetch(request, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
          if (!response.ok) throw new Error(`Falha ao obter identidade do job: HTTP ${response.status}`);
          const { value } = await response.json();
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
          const names = ['repository_id', 'repository_owner_id', 'ref', 'workflow_ref', 'sub', 'event_name', 'environment'];
          console.log(JSON.stringify(Object.fromEntries(names.map(name => [name, claims[name]]))));
          JS
      - name: Autenticar com identidade temporaria do GitHub
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: sergio-6ceff
          workload_identity_provider: projects/364283541545/locations/global/workloadIdentityPools/crm-homologacao-20261127/providers/github
          service_account: crm-hosting-homologacao@sergio-6ceff.iam.gserviceaccount.com
      - name: Compilar e publicar somente o frontend de homologacao
        run: firebase deploy --only hosting:homologacao --project sergio-6ceff --non-interactive
        env:
          NG_CLI_ANALYTICS: 'false'
