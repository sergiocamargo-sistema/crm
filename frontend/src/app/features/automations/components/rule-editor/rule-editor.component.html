<form novalidate (submit)="save($event)" [attr.aria-busy]="state.saving()">
  <div class="dialog__body layout-stack">
    <fieldset class="layout-stack" [disabled]="state.saving()">
      <label>
        <span class="form-label">Nome da automação</span>
        <input
          #nameInput
          class="form-input"
          [formField]="fields.name"
          [attr.aria-describedby]="errors().name ? 'automation-rule-name-error' : null"
        />
        @if (errors().name) {
          <span class="form-error" id="automation-rule-name-error">{{ errors().name }}</span>
        }
      </label>

      <label>
        <span class="form-label">Quando criar uma solicitação com o padrão</span>
        <select
          #patternInput
          class="form-select"
          [formField]="fields.patternId"
          [attr.aria-describedby]="errors().pattern ? 'automation-rule-pattern-error' : null"
        >
          <option value="">
            {{
              state.catalog().patterns.length ? 'Selecione o padrão' : 'Nenhum padrão cadastrado'
            }}
          </option>
          @for (pattern of state.catalog().patterns; track pattern.id) {
            <option [value]="pattern.id">{{ pattern.name }}</option>
          }
        </select>
        @if (errors().pattern) {
          <span class="form-error" id="automation-rule-pattern-error">{{ errors().pattern }}</span>
        }
      </label>

      <div class="inline-controls">
        <label>
          <span class="form-label">Iniciar conjunto de tarefas</span>
          <select
            #setInput
            class="form-select"
            [formField]="fields.setId"
            [attr.aria-describedby]="errors().set ? 'automation-rule-set-error' : null"
          >
            <option value="">
              {{ sets().length ? 'Selecione o conjunto' : 'Nenhum conjunto cadastrado' }}
            </option>
            @for (set of sets(); track set.id) {
              <option [value]="set.id">{{ set.name }}</option>
            }
          </select>
          @if (errors().set) {
            <span class="form-error" id="automation-rule-set-error">{{ errors().set }}</span>
          }
        </label>
        <button
          #newSetButton
          type="button"
          class="text-button"
          aria-haspopup="dialog"
          (click)="createSet.emit(newSetButton)"
        >
          Novo conjunto
        </button>
      </div>

      @if (selectedSet()) {
        <app-task-set-flow [steps]="preview()" />
      }

      <label class="check">
        <input
          type="checkbox"
          [formField]="fields.enabled"
          aria-describedby="automation-rule-toggle-hint"
        />
        Ativar automação
      </label>
      <p id="automation-rule-toggle-hint" class="muted">
        Vale para novas solicitações. As execuções em andamento continuam ao desativar.
      </p>
      @if (hasOtherEnabledRule()) {
        <p class="muted">As outras automações ativas para este padrão também serão executadas.</p>
      }
    </fieldset>
    @if (state.actionError()) {
      <p class="form-error" role="alert">{{ state.actionError() }}</p>
    }
  </div>
  <div class="dialog__footer">
    <button type="button" class="button" [disabled]="state.saving()" (click)="cancelled.emit()">
      Cancelar
    </button>
    <button type="submit" class="button button--primary" [disabled]="state.saving()">
      {{
        state.saving()
          ? 'Salvando...'
          : draft().enabled && !record()?.enabled
            ? 'Salvar e ativar'
            : 'Salvar'
      }}
    </button>
  </div>
</form>
