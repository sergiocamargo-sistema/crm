<form novalidate (submit)="save($event)" [attr.aria-busy]="state.saving()">
  <div class="dialog__body layout-stack">
    <fieldset [disabled]="state.saving()" class="editor-fields">
      <label>
        <span class="form-label">Título da tarefa</span>
        <input #titleInput class="form-input" [formField]="fields.title" />
      </label>
      <app-mention-editor
        controlId="automation-template-description"
        label="Instruções para a equipe"
        [formField]="fields.description"
        [rows]="3"
      />
      <app-assignee-picker [formField]="fields.assigneeIds" />

      <details #options class="disclosure">
        <summary>Prioridade, etiquetas e prazo</summary>
        <div class="layout-stack">
          <label>
            <span class="form-label">Prioridade</span>
            <select class="form-select form-input--compact" [formField]="fields.priority">
              @for (priority of priorities; track priority.value) {
                <option [value]="priority.value">{{ priority.label }}</option>
              }
            </select>
          </label>
          <app-task-label-picker
            controlId="automation-template-labels"
            [catalog]="state.catalog().labels"
            [formField]="fields.labelIds"
          />
          <label class="check">
            <input type="checkbox" [formField]="fields.dueEnabled" />
            Definir prazo
          </label>
          @if (draft().dueEnabled) {
            <label>
              <span class="form-label">Dias após a criação da tarefa</span>
              <input
                #dueInput
                type="number"
                class="form-input form-input--compact"
                step="1"
                [formField]="fields.dueDays"
                aria-describedby="template-due-hint"
              />
            </label>
            <p id="template-due-hint" class="muted">Use 0 para vencer no mesmo dia.</p>
          }
        </div>
      </details>
    </fieldset>
    @if (error() || state.actionError()) {
      <p class="form-error" role="alert">{{ error() || state.actionError() }}</p>
    }
  </div>

  <div class="dialog__footer">
    <button type="button" class="button" [disabled]="state.saving()" (click)="cancelled.emit()">
      Cancelar
    </button>
    <button type="submit" class="button button--primary" [disabled]="state.saving()">
      {{ state.saving() ? 'Salvando...' : 'Salvar modelo' }}
    </button>
  </div>
</form>
