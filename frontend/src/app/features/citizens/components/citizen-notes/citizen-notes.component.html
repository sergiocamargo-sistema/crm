<div class="layout-stack">
  <button
    type="button"
    class="observations"
    aria-label="Editar observação do munícipe"
    aria-describedby="citizen-observation-text"
    aria-haspopup="dialog"
    (click)="open($event)"
  >
    <span id="citizen-observation-text">{{
      citizen().observations || 'Adicionar observação'
    }}</span>
  </button>
  <app-citizen-categories
    [inputId]="'citizen-categories-' + citizen().id"
    [citizenId]="citizen().id"
    [selected]="citizen().categories"
  />
</div>
<dialog
  #editor
  class="dialog notes-editor"
  aria-labelledby="notes-editor-title"
  (close)="onClose()"
  (click)="onBackdropClick($event)"
>
  <div class="dialog__header">
    <h2 id="notes-editor-title">Editar observação</h2>
    <button type="button" class="icon-button" aria-label="Fechar edição" (click)="editor.close()">
      <app-icon name="close" />
    </button>
  </div>
  <form (submit)="save($event)" novalidate>
    <div class="dialog__body layout-stack">
      <label
        ><span class="form-label">Observação</span
        ><textarea class="form-input" rows="6" [formField]="observationForm.text"></textarea>
      </label>
      @if (attempted() && observationForm.text().invalid()) {
        <p class="form-error" role="alert">A observação deve ter até 5.000 caracteres.</p>
      }
      @if (failure()) {
        <p class="form-error" role="alert">{{ failure() }}</p>
      }
    </div>
    <div class="dialog__footer">
      <button type="button" class="button" (click)="editor.close()">Cancelar</button
      ><button type="submit" class="button button--primary">Salvar observação</button>
    </div>
  </form>
</dialog>
<p class="sr-only" role="status">{{ status() }}</p>
