@if (selected().length) {
  <ul class="task-label-list" aria-label="Etiquetas da tarefa">
    @for (label of selected(); track label.id) {
      <li>
        <app-task-label-chip
          [label]="label"
          [removable]="removable()"
          [disabled]="disabled()"
          (removed)="removed.emit($event)"
        />
      </li>
    }
  </ul>
}
