<button
  #trigger
  type="button"
  class="icon-button"
  [attr.aria-label]="'Notificações de ' + recipientName() + ': ' + unread() + ' não lidas'"
  title="Notificações"
  aria-haspopup="dialog"
  aria-controls="notification-panel"
  (click)="open(trigger)"
>
  <app-icon name="bell" />
  @if (unread()) {
    <span class="icon-button__badge" aria-hidden="true">{{ unread() }}</span>
  }
</button>
<dialog
  #panel
  id="notification-panel"
  class="dialog notifications-dialog"
  aria-labelledby="notifications-title"
  (close)="closed()"
>
  <div class="dialog__header">
    <h2 id="notifications-title">Notificações</h2>
    <button
      type="button"
      class="icon-button"
      aria-label="Fechar notificações"
      (click)="panel.close()"
    >
      <app-icon name="close" />
    </button>
  </div>
  <div class="dialog__body notification-content">
    <button type="button" class="text-button" [disabled]="!unread()" (click)="team.markAllRead()">
      Marcar todas como lidas
    </button>
    <ul class="notification-list">
      @for (item of items(); track item.id) {
        <li [class.is-unread]="!item.readAt">
          <a
            [routerLink]="['/kanban']"
            [queryParams]="{ tarefa: item.taskId, comentario: item.commentId }"
            (click)="team.markRead(item.id); panel.close()"
          >
            <app-icon name="message" />
            <span
              ><strong>{{ item.actor }}</strong> mencionou você
              {{ item.commentId ? 'em um comentário de' : 'no cartão' }}
              <strong>{{ item.taskTitle }}</strong><time [attr.datetime]="item.createdAt">{{
                item.createdAt | date: 'dd/MM HH:mm' : '-0300'
              }}</time></span
            >
          </a>
        </li>
      } @empty {
        <li class="empty-notifications">Nenhuma notificação por enquanto.</li>
      }
    </ul>
  </div>
</dialog>
