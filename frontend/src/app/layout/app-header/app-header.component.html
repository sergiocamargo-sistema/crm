<header class="topbar">
  <div class="topbar-inner">
    <a routerLink="/" class="brand" aria-label="Sérgio Camargo · Início">
      <img
        class="brand-logo"
        ngSrc="brand/sergio-camargo.svg"
        width="312"
        height="64"
        alt="Vereador Sérgio Camargo"
        priority
      />
    </a>
    <app-citizen-search /><app-notifications /><span
      class="avatar profile-avatar"
      role="img"
      [attr.aria-label]="'Perfil de ' + profile()?.name"
      [title]="profile()?.email ?? ''"
      >{{ profile()?.initials }}</span
    >
    <a routerLink="/sair" class="icon-button" aria-label="Sair da conta" title="Sair da conta">
      <app-icon name="logout" />
    </a>
  </div>
  <div class="brand-line" aria-hidden="true"><span></span></div>
  @if (auth.error(); as error) {
    <p class="session-error" role="alert">{{ error }}</p>
  }
</header>
